/* Storytime 2 · Scene 2 in the painted style (Joe, 28 Oct: 'can i see it from the beginning with grik', then 'what can we do for the wasteland scene too').
   2.1 and 2.4 are one wide: an empty-plate loop from Dreamina under everything, the sky turned further by a flow-map shader, and Joe lifted out of
   his two clips (the walk, the drop) by difference against the still plate, so the cuts never show. 2.2 and 2.3 are the painted stills with the same sky.
   On top: days passing on the walk with footprints in the ash, a storm that builds to the nest, soot to rub off the sign, an eggshell clue in the nest,
   and the collapse (slow, grey, tunnel vision, heartbeat) with the oasis the only colour left; tap it to focus. */
@font-face{font-family:"Joes Journey Headline";src:url("https://cdn.prod.website-files.com/6a19b8f4191d4fbca532591e/6a19b8f4191d4fbca532594d_Joes%20Journey%20Headline.otf") format("opentype");font-display:swap;}
:root{--ink:#3a2a12;--paper:#f3e2ba;--pink:#FF00F5;--bg:#04060b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:"Joes Journey Headline",sans-serif;}
body{display:flex;flex-direction:column;height:100vh;height:100svh;overflow:hidden;}
.top{display:flex;justify-content:center;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;font-size:15px;opacity:.8;}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.pw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;}
.pane{position:relative;flex:none;width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9;overflow:hidden;background:var(--bg);}
/* (performance, Joe 3 Nov: Grik's scene lagged on an Intel Mac) the soft edges are the page's own black laid over the picture, under the dialogue box, not a mask on it:
   a mask made the browser draw every video frame twice */
.pane::after{content:"";position:absolute;inset:0;z-index:14;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 0,transparent 5%,transparent 95%,var(--bg) 100%),linear-gradient(to right,var(--bg) 0,transparent 2%,transparent 98%,var(--bg) 100%);}
.shot{position:absolute;inset:0;opacity:0;transition:opacity .4s ease;}
.shot.on{opacity:1;}
.cam{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 9s cubic-bezier(.3,0,.25,1),filter 1.6s ease,opacity 1.6s ease;}
.cam.out{transition:none;}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;}
.src{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;}
.joe{position:absolute;left:68.75%;top:33.333%;width:31.25%;height:50%;opacity:0;transition:opacity .2s,filter 1.4s ease;z-index:3;}
.joe.on{opacity:1;}
/* the collapse: everything but the oasis drains to grey */
.grey{filter:saturate(.1) brightness(.82) contrast(1.05)!important;}
#skyw,#prints{transition:filter 1.4s ease;}
#oasis{position:absolute;inset:auto;left:90.5%;top:39.6%;width:10%;height:auto;aspect-ratio:420/222;opacity:0;transition:opacity 2.5s ease,scale 1.2s ease;z-index:2;}
#glow{position:absolute;left:87%;top:33%;width:17%;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(90,255,230,.35),rgba(90,255,230,0));opacity:0;transition:opacity 2.5s ease,scale 1.2s ease;z-index:1;mix-blend-mode:screen;}
#oasis.on,#glow.on{opacity:1;}
#oasis.focus{scale:1.12;}#glow.focus{scale:1.4;}
/* days passing: a night tint and a dawn tint over the wide, stars and a moon in the sky */
.tod{position:absolute;inset:0;z-index:4;mix-blend-mode:multiply;opacity:0;pointer-events:none;}
#night{background:linear-gradient(#3a3f8c,#5b5fa8 55%,#6c6aa0);}
#dawn{background:linear-gradient(#ffb7a8,#ffd2a0 60%,#fff0e0);}
#stars{z-index:4;pointer-events:none;}
#shard{position:absolute;left:77.6%;top:66.8%;width:2.6%;opacity:0;transition:opacity .6s ease;filter:drop-shadow(0 0 3px rgba(255,190,90,.9));z-index:2;}
#shard.on{opacity:1;animation:glint 1.4s ease-in-out infinite;}
#shard.took{opacity:0;translate:-260% 300%;scale:.35;rotate:-40deg;transition:opacity .9s ease .2s,translate .9s cubic-bezier(.5,0,.75,.4),scale .9s ease,rotate .9s ease;animation:none;}

.vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 55%,transparent 45%,rgba(10,4,12,.55));pointer-events:none;}
#melt.melt{filter:blur(10px) saturate(1.4) brightness(1.5);opacity:0;}
#murk{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:linear-gradient(rgba(16,6,10,.85),rgba(30,14,10,.25) 55%,rgba(10,6,6,.5));}

#dust{z-index:4;}#embers{z-index:5;}

#tunnel.on{opacity:1;--r:52%;}

#dip.on{opacity:1;}

#signbox img,#signbox canvas{position:absolute;inset:0;width:100%;height:100%;}

.sm{position:absolute;top:10px;right:10px;z-index:20;font-size:13px;}
.snd{display:flex;align-items:center;gap:7px;font:inherit;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;margin-left:auto;transition:background .2s ease;}

.bub b{grid-column:2;align-self:end;font-weight:normal;font-size:.75em;opacity:.7;}
.bub span{grid-column:2;align-self:start;font-style:italic;}
.bub::before,.bub::after{content:"";position:absolute;border-radius:50%;background:rgba(14,18,30,.9);border:1px solid rgba(255,255,255,.5);}
.bub::before{left:16px;bottom:-12px;width:12px;height:12px;}.bub::after{left:10px;bottom:-21px;width:7px;height:7px;}

.cover{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(4,6,11,.45);transition:opacity .4s ease;}

.cap .tap.on{opacity:1;}
.cap .nx{position:absolute;right:16px;bottom:10px;display:flex;align-items:center;gap:7px;font-size:.72em;color:color-mix(in srgb,var(--who,#6b4a1e) 65%,#000);opacity:0;transition:opacity .3s ease;pointer-events:none;}
/* Next, as in Pokemon and Animal Crossing: a bobbing arrow at the bottom-right of the box once the line is fully typed, with the progress line

.cap .nx .pg{width:72px;height:3px;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--who,#6b4a1e) 22%,transparent);}
.cap .nx .pg b{display:block;height:100%;background:var(--who,#6b4a1e);transform-origin:0 50%;transform:scaleX(0);}
.cap .nx.wait .pg b{animation:nxglow 1.6s ease-in-out infinite;}
.cap .nx .arw{width:12px;height:8px;fill:currentColor;animation:nxbob .9s ease-in-out infinite;}

@keyframes nxglow{50%{opacity:.45;}}
@media (orientation:landscape) and (max-height:560px){
  .top{display:none;}.stage{padding:0;gap:0;position:relative;}.pw{height:100%;}

}

  function signShot() { step = 'sign'; stormTo = .75; cut(sshot, function () { bgv.pause(); show(walk, 0); push(cams, '62% 50%', 1.06); txt.textContent = ''; speaker('Joe'); });
    later(function () { think('Joe', 'Could this really all have been Trogdor?', .31, .27, 's2-02-joe'); nxOn(0); }, 1300);
    later(function () { if (step === 'sign') signDown(); }, 2600); }
  function signDown() { show(ring, 0); step = 'rub'; sootUp(); show(signbox, 1); signbox.classList.add('rub'); prompt('Rub the soot off the sign ↗'); }
  function signClean() { step = 'reading'; signbox.classList.remove('rub'); soot.style.opacity = 0; prompt(''); nxOn(3600); later(nestShot, 3600); }

  /* 2.3 close: the nest, empty; tap it, look closer, and pick up the eggshell */
  function nestShot() { if (['sign', 'rub', 'reading'].indexOf(step) < 0) return; step = 'nest'; stormTo = 1; nxOn(0); show(ring, 0); prompt(''); show(bub, 0); show(signbox, 0); signbox.classList.remove('rub');
    cut(nshot, function () { push(camn, '72% 62%', 1.07); });
    later(function () { think('Joe', 'A dragon’s nest...and the eggs are gone.', .61, .27, 's2-03-joe'); }, 1300);
    later(function () { if (step === 'nest') { ringAt(.79, .69, 9); prompt('Tap the nest ↑'); } }, 3200); }
  function nestClose() { step = 'shard'; show(ring, 0); show(bub, 0); prompt(''); stormTo = .6; frameOn(camn, .79, .68, 2.1, 1.6);
    later(function () { show(shard, 1); }, 1400);
    later(function () { if (step === 'shard') { ringAt(.557, .52, 10); prompt('Something glints in the ash. Tap it'); } }, 2200); }
  function takeShard() { step = 'took'; show(ring, 0); prompt(''); shard.classList.add('took'); later(chime, 950); type('Joe', 'A piece of eggshell...still warm.', 's2-03b-joe'); nxOn(4600);
    try { if (window.jjScore && window.jjScore.award) window.jjScore.award('st2-eggshell'); } catch (e) {}
    later(function () { prompt('Joe keeps the shard. It might matter later.'); }, 1600);
    later(kneel, 4600); }

  /* 2.4 wide: his legs give way (slow, the colour draining, his sight closing in, his heart pounding); the oasis is the only colour left; tap it to focus */
  function kneel() { if (['nest', 'shard', 'took'].indexOf(step) < 0) return; step = 'kneel'; stormTo = .4; nxOff(); show(ring, 0); prompt(''); show(bub, 0);
    cut(wide, function () { var p = bgv.play(); if (p && p.catch) p.catch(function () {}); try { drop.currentTime = 0; } catch (e) {} show(drop, 1); push(camw, '50% 50%', 1); txt.textContent = ''; speaker('Narrator'); });
    later(function () { play(drop); }, 900);
    later(function () { drop.playbackRate = .5; GREY.forEach(function (e) { e.classList.add('grey'); }); show(tunnel, 1); heartbeat(5); }, 1700);
    later(function () { drop.playbackRate = 1; }, 3500);
    later(function () { type('Narrator', N2, 's2-04-narrator'); }, 2600);
    later(function () { show(oasis, 1); show(glow, 1); push(camw, '93% 45%', 1.18); fadeMusic(2500); if (window.jjKit && jjKit.lead) jjKit.lead(jjKit.base + 'story2-music-oasis.mp3', OASIS_IN); }, 4200);   /* the oasis music comes in as he sights it, as the tale's: Scene 3 takes it over */
    later(function () { if (step === 'kneel') { step = 'focus'; ringAt(.945, .445, 8); prompt('Tap the shimmer to focus his eyes'); nxOn(0); } }, 7600); }
  function focus() { step = 'focused'; show(ring, 0); prompt(''); nxOff(); ampTo = 0; oasis.classList.add('focus'); glow.classList.add('focus');
    GREY.forEach(function (e) { e.classList.remove('grey'); }); show(tunnel, 0);
    later(function () { type('Narrator', N3, 's2-05-narrator'); nxOn(5000); }, 600);
    later(function () { ampTo = 1.6; oasis.classList.remove('focus'); }, 2600);
    later(function () { melt.classList.add('melt'); stormTo = 0; }, 5600);
    later(end, 7300); }
  function end() { if (window.jjKit && jjKit.flow) { nxOff && nxOff(); jjKit.done(); return; }   /* the one flow: no end card, the next scene follows */
    step = 'end'; show(drop, 0); show(oasis, 0); show(glow, 0); speaker('Narrator'); txt.textContent = 'End of Scene 2. Next: Scene 3, the dragon oasis.'; go.querySelector('span').textContent = 'Play again'; $('next3').hidden = false; cover.classList.remove('off'); }

  ring.addEventListener('click', function () { if (!ring.classList.contains('on')) return;
    if (step === 'sign') signDown(); else if (step === 'nest') nestClose(); else if (step === 'shard') takeShard(); else if (step === 'focus') focus(); });
  function next() { if (!gate()) return;
    if (step === 'walk') { step = 'walked'; clearInterval(typeT); walk.pause(); signShot(); }
    else if (step === 'sign' || step === 'rub' || step === 'reading') nestShot(); else if (step === 'nest' || step === 'shard' || step === 'took') kneel(); else if (step === 'focus') focus();
    else if (step === 'focused') { step = 'ending'; nxOff(); melt.classList.add('melt'); stormTo = 0; later(end, 1700); } }
  cap.addEventListener('click', next);
  addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'Enter') next(); });

  go.addEventListener('click', start);
  speaker('Narrator');
})();
</script>
</body>
