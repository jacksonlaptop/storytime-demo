<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Storytime so far</title>
<meta name="description" content="Joe's Journey: Storytime Part One, then Part Two so far, in one go.">
<style>
/* Storytime so far: Part One, the portfolio card, then Part Two's scenes, one after another with nothing to press. Each part is its own page in a frame;
   the next one loads unseen while the current one plays, waits on its first picture, and cross-fades in when the current one says it is done. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease;}
iframe.on{opacity:1;pointer-events:auto;}

/* the one sound control for every part: the site's moon, bottom right (each part's own moon is hidden in the flow). Light and playing = sound on; dark = muted */
#jjm-moon{position:fixed;bottom:32px;right:32px;z-index:2147483647;width:64px;height:64px;padding:0;border:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;overflow:hidden;background:radial-gradient(circle at 34% 30%,#fff 0%,#e7f1fb 55%,#cfe0f2 100%);box-shadow:0 0 18px rgba(199,231,255,.5),0 0 40px rgba(160,190,255,.28);transition:background .25s,transform .2s;}
#jjm-moon:hover{transform:scale(1.06);}#jjm-moon:active{transform:scale(.96);}
#jjm-moon .cr{position:absolute;border-radius:50%;background:#93a9c6;pointer-events:none;}
#jjm-moon .bar{position:relative;z-index:2;width:3px;height:30px;border-radius:2px;background:#111;transform:scaleY(.3);animation:jjmBar var(--bd,1.1s) ease-in-out var(--bl,0s) infinite alternate;transition:background .2s;}
#jjm-moon.muted{background:#111;}#jjm-moon.muted .cr{background:rgba(255,255,255,.16);}#jjm-moon.muted .bar{background:#fff;height:3px;animation:none;transform:none;}
@keyframes jjmBar{0%{transform:scaleY(calc(var(--bm,1) * .22));}40%{transform:scaleY(calc(var(--bm,1) * .95));}68%{transform:scaleY(calc(var(--bm,1) * .48));}100%{transform:scaleY(calc(var(--bm,1) * .8));}}
@media (prefers-reduced-motion:reduce){#jjm-moon .bar{animation:none;transform:scaleY(calc(var(--bm,1) * .6));}}
@media (max-width:767px){#jjm-moon{right:16px;bottom:16px;width:52px;height:52px;}}
</style>
</head>
<body>
<button id="jjm-moon" type="button" aria-label="Sound"><i class="cr" style="width:11px;height:11px;left:13px;top:15px;opacity:.2"></i><i class="cr" style="width:7px;height:7px;left:41px;top:32px;opacity:.14"></i><i class="cr" style="width:8px;height:8px;left:24px;top:43px;opacity:.12"></i><i class="bar" style="--bm:.5;--bd:.92s;--bl:-.2s"></i><i class="bar" style="--bm:.78;--bd:1.24s;--bl:-.75s"></i><i class="bar" style="--bm:1;--bd:1.06s;--bl:-.4s"></i><i class="bar" style="--bm:.78;--bd:1.38s;--bl:-1.1s"></i><i class="bar" style="--bm:.5;--bd:.84s;--bl:-.6s"></i></button>
<script>
/* sound: one state for every part (sessionStorage jjUserMuted, the site's own: '1' = muted), shown and set by the moon. The parts read it as they start and
   follow it when it changes; the scene-to-scene music lives here, on this page, so it carries on across the painted scenes (window.jjFlowMusic) */
(function () {
  var moon = document.getElementById('jjm-moon'), MUSIC = {}, last = null;
  /* muted, as the site counts it: the moon's flag, or every mixer level at 0 (the site's sound code turns the flag into that) */
  function muted() { var f = false, z = false; try { f = sessionStorage.getItem('jjUserMuted') === '1'; var x = JSON.parse(localStorage.getItem('jjMix') || 'null'); z = !!x && !(x.voice > 0 || x.sfx > 0 || x.music > 0); } catch (e) {} return f || z; }
  function sndSet(m) { try { sessionStorage.setItem('jjUserMuted', m ? '1' : '0'); if (!m) { var x = JSON.parse(localStorage.getItem('jjMix') || 'null'); if (x && !(x.voice > 0 || x.sfx > 0 || x.music > 0)) { var p = JSON.parse(localStorage.getItem('jjMixAllPrev') || 'null'); localStorage.setItem('jjMix', JSON.stringify(p && (p.voice > 0 || p.sfx > 0 || p.music > 0) ? p : { voice: 1, sfx: 1, music: 1 })); } } } catch (e) {} }
  function apply() { var m = muted(); moon.classList.toggle('muted', m); moon.setAttribute('aria-pressed', m ? 'true' : 'false');
    Object.keys(MUSIC).forEach(function (u) { var a = MUSIC[u]; a.muted = m; if (!m && !a.volume && !a._lead) a.volume = .32; });
    if (last !== null && last !== m) [].forEach.call(document.querySelectorAll('iframe'), function (f) { try { f.contentWindow.postMessage({ jj: 'sound' }, location.origin); } catch (e) {} });
    last = m; }
  window.jjFlowMusic = function (u) { var a = MUSIC[u]; if (!a) { a = MUSIC[u] = new Audio(u); a.loop = true; a.preload = 'auto'; } a.muted = muted(); return a; };
  /* a lead-in: the next part's music, started under the end of this one (Scene 2's mirage brings in Scene 3's oasis intro, as the tale does), from o.from,
     in over o.inMs to o.vol; if the next part is late, it goes back to o.from before o.until (so its lift is never heard early). The next part takes it over
     by playing the same track itself and calling jjFlowMusicFade. */
  function ramp(a, to, ms, then) { clearInterval(a._rampT); var v0 = a.volume, t0 = performance.now(); a._rampT = setInterval(function () { var k = Math.min(1, (performance.now() - t0) / ms); a.volume = v0 + (to - v0) * k; if (k >= 1) { clearInterval(a._rampT); if (then) then(); } }, 40); }
  window.jjFlowLead = function (u, o) { var a = window.jjFlowMusic(u); a.loop = false; a._lead = true; a.volume = 0; try { a.currentTime = o.from; } catch (e) {} var p = a.play(); if (p && p.catch) p.catch(function () {}); ramp(a, o.vol, o.inMs || 2500);
    clearInterval(a._watchT); a._watchT = setInterval(function () { if (a._out || a.paused || !(a.currentTime >= o.until)) return; ramp(a, 0, 700, function () { try { a.currentTime = o.from; } catch (e) {} ramp(a, o.vol, 1200); }); }, 200); return a; };
  window.jjFlowMusicFade = function (match, ms) { Object.keys(MUSIC).forEach(function (u) { var a = MUSIC[u]; if (u.indexOf(match) < 0 || a._out || a.paused) return; a._out = true; clearInterval(a._watchT); ramp(a, 0, ms || 1200, function () { a.pause(); delete MUSIC[u]; }); }); };
  moon.addEventListener('click', function () { sndSet(!muted()); apply(); });
  setInterval(apply, 400); apply();   // (a part may change it too: Part One's 'Turn on the sound!', a transport's mute)
})();
</script>
<script>
(function () {
  var V = 14, PARTS = ['../journey/', '../scene1/', '../scene2/', '../scene3/'];
  var cur = null, nxt = null, at = -1, want = false;
  /* (checking: ?from=N starts at part N; anything else in the address goes to that first part, e.g. ?from=0&scene=9 for the end of Part One) */
  var q = new URLSearchParams(location.search), FROM = Math.min(PARTS.length - 1, +q.get('from') || 0); q.delete('from'); var EXTRA = q.toString();
  function frame(i, ex) { var f = document.createElement('iframe'); f.allow = 'autoplay; fullscreen'; f.title = 'Storytime'; f.dataset.i = i; f.src = PARTS[i] + '?flow=1&v=' + V + (ex != null ? (ex ? '&' + ex : '') : (i === FROM && EXTRA ? '&' + EXTRA : '')); document.body.appendChild(f); return f; }
  function swap() {
    var old = cur; cur = nxt; nxt = null; want = false; at = +cur.dataset.i;
    cur.classList.add('on'); try { cur.contentWindow.postMessage({ jj: 'go' }, location.origin); cur.focus(); } catch (e) {}
    if (old) setTimeout(function () { old.remove(); }, 1000);
    if (at + 1 < PARTS.length) setTimeout(function () { if (!nxt && at + 1 < PARTS.length) nxt = frame(at + 1); }, 4000);   // the next part loads behind this one
  }
  addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.jj === 'done' && cur && e.source === cur.contentWindow && at + 1 < PARTS.length) { want = true; if (!nxt) nxt = frame(at + 1); if (nxt.dataset.ready) swap(); }
    if (e.data.jj === 'ready' && nxt && e.source === nxt.contentWindow) { nxt.dataset.ready = 1; if (want) swap(); }
  });
  nxt = frame(FROM); nxt.addEventListener('load', swap, { once: true });   // Part One starts at once

  /* the scene picker (Joe, 3 Nov): on by itself in the local preview, elsewhere only with ?scenes=1. A 'Scenes' pill bottom left opens a strip: a tab per
     scene, a picture per shot; a press plays from there (its part loaded in place of this one, or a jump inside the part already playing). It hides under
     the sound question. Scenes 3 to 5: [shot, its first line in storytime2.js's beats, poster] (re-read them from jjStory2.beats when the script changes) */
  if (!(/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || q.get('scenes') === '1')) return;
  var GH = location.port === '3800' ? '/gh/' : 'https://rawcdn.githack.com/jacksonlaptop/joes-journey-code/36609cde8b790f0cf1065d4af13f641eacaccda2/',   /* (the same pinned commit as the parts' JJD_REF) */ P = function (id) { return GH + 'story2-whole-' + id + '-ns-s-poster.webp'; };
  var PICK = [{ n: 'Part One', head: 'The tale so far: the portal at the end of Part One', part: 0, shots: [['From the start', null, GH + 'story-wood-portal-15-poster.webp']] },
    { n: 'Scene 1', head: 'EXT. THE PORTAL WASTELAND — DUSK', part: 1, shots: [['From the start', null, '../scene1/plate-c.jpg']] },
    { n: 'Scene 2', head: 'EXT. THE ASH DESERT — DAY', part: 2, shots: [['From the start', null, '../scene2/plate-sign.jpg']] },
    { n: 'Scene 3', head: 'EXT. THE OASIS', part: 3, shots: [['3.1', 23, P('3_2')], ['3.2', 24, P('3_2')], ['3.3', 26, P('3_3')], ['3.4', 30, P('3_4')], ['3.5', 34, P('3_5')], ['3.6', 39, P('3_6')], ['3.6b', 41, P('3_6b')], ['3.6d', 44, P('3_6d')], ['3.7', 48, P('3_7')], ['3.8', 53, P('3_8')], ['3.9', 64, P('3_9')]] },
    { n: 'Scene 4', head: 'EXT. THE SKY — THE JOURNEY', part: 3, shots: [['4.1', 66, P('4_1')], ['4.2', 67, P('4_2')]] },
    { n: 'Scene 5', head: 'EXT. THE FLOATING CASTLE — DAY', part: 3, shots: [['5.1', 69, P('5_1')], ['5.2', 70, P('5_2')], ['5.3', 73, P('5_3')], ['5.4', 75, P('5_4')], ['5.5', 78, P('5_5')], ['5.6', 80, P('5_6')], ['5.7', 81, P('5_7-frost')]] }];
  var css = document.createElement('style');
  css.textContent = '#jjp{position:fixed;left:16px;bottom:16px;z-index:50;font-family:"Joes Journey Headline",sans-serif;color:#fff;}#jjp.off{display:none;}' +
    '#jjp .pill,#jjp .tab{font:inherit;color:#fff;cursor:pointer;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:8px 16px;font-size:14px;line-height:1;transition:background .2s ease;}' +
    '#jjp .pill:hover,#jjp .tab:hover{background:rgba(255,255,255,.2);}#jjp .tab.on{background:rgba(255,255,255,.85);color:#111;}' +
    '#jjp .pan{position:fixed;left:16px;right:16px;bottom:64px;max-width:1200px;padding:12px;border-radius:18px;background:#080b14;border:1px solid rgba(255,255,255,.5);opacity:0;translate:0 12px;pointer-events:none;transition:opacity .25s ease,translate .25s ease;}' +
    '#jjp.open .pan{opacity:1;translate:0 0;pointer-events:auto;}#jjp .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}#jjp .tab{flex:none;padding:6px 12px;font-size:13px;}' +
    '#jjp .head{font-size:13px;opacity:.8;margin:2px 4px 8px;}#jjp .row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;}' +
    '#jjp .sh{flex:none;width:clamp(112px,14vw,176px);cursor:pointer;background:none;border:0;padding:0;color:#fff;font:inherit;text-align:left;}' +
    '#jjp .sh i{display:block;aspect-ratio:16/9;border-radius:10px;background:#1a2033 center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.25);opacity:.92;transition:box-shadow .2s ease,opacity .2s ease;}' +
    '#jjp .sh:hover i{opacity:1;box-shadow:0 0 0 2px rgba(255,255,255,.7);}#jjp .sh.on i{box-shadow:0 0 0 3px #ff5fa2;}#jjp .sh span{display:block;font-size:12px;margin-top:5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}' +
    '@media (min-width:600px){#jjp .pan{right:104px;}}';
  document.head.appendChild(css);
  var root = document.createElement('div'); root.id = 'jjp'; root.innerHTML = '<div class="pan"><div class="tabs"></div><div class="head"></div><div class="row"></div></div><button class="pill" type="button">Scenes</button>'; document.body.appendChild(root);
  var tabs = root.querySelector('.tabs'), head = root.querySelector('.head'), row = root.querySelector('.row');
  function inner() { try { return cur && cur.contentWindow; } catch (e) { return null; } }
  function here() { var w = inner(), c = ''; try { c = String(w.jjStory.api.comp() || '').slice(3); } catch (e) {} return c; }
  function sceneNow() { var c = here(); return PICK.filter(function (sc) { return sc.part === at && (sc.part < 3 || sc.shots.some(function (s) { return s[0] === c; })); })[0] || PICK.filter(function (sc) { return sc.part === at; })[0] || PICK[0]; }
  function go(sc, sh) { root.classList.remove('open');
    if (sc.part === at && sh[1] != null && inner()) { inner().postMessage({ jj: 'jump', scene: sh[1] }, location.origin); return; }   // (a shot in the part already playing)
    if (nxt) nxt.remove(); want = false; nxt = frame(sc.part, sh[1] != null ? 'scene=' + sh[1] : ''); nxt.addEventListener('load', swap, { once: true }); }
  function show(sc) { [].forEach.call(tabs.children, function (t) { t.classList.toggle('on', t._sc === sc); }); head.textContent = sc.head; row.innerHTML = ''; var c = here();
    sc.shots.forEach(function (sh) { var b = document.createElement('button'); b.type = 'button'; b.className = 'sh' + ((sc.part === at && (sh[1] == null || sh[0] === c)) ? ' on' : ''); b.innerHTML = '<i></i><span></span>';
      b.firstChild.style.backgroundImage = 'url("' + sh[2] + '")'; b.lastChild.textContent = sh[0]; b.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); go(sc, sh); }); row.appendChild(b); }); }
  PICK.forEach(function (sc) { var t = document.createElement('button'); t.type = 'button'; t.className = 'tab'; t.textContent = sc.n; t._sc = sc; t.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); show(sc); }); tabs.appendChild(t); });
  root.querySelector('.pill').addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); var op = !root.classList.contains('open'); if (op) show(sceneNow()); root.classList.toggle('open', op); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape') root.classList.remove('open'); });
  setInterval(function () { var hide = false; try { var d = cur && cur.contentDocument; hide = !cur || !!(d && d.querySelector('#jjst-sndov.on')); } catch (e) {} root.classList.toggle('off', hide); if (hide) root.classList.remove('open'); }, 300);   // (never over the sound question)
})();
</script>
</body>
