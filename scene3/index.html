<script>
document.addEventListener("DOMContentLoaded", function () {
  // 1. Split .loading-text into characters
  const loadingText = document.querySelector('.loading-text');
  const revealBlock = document.querySelector('.white-load-in-reveal');
  if (!loadingText || !revealBlock) return;

  // Split into chars
  const split = new SplitText(loadingText, { type: "chars" });
  const chars = split.chars;

  // 2. Animate each letter popping in with a bounce
  const loadingTextTl = gsap.timeline({ 
    paused: true, 
    defaults: { ease: "back.out(2)", duration: 0.5 }
  });

  loadingTextTl.fromTo(chars, 
    { y: 40, opacity: 0, color: "#FFFFFFF", }, 
    { 
      y: 0, opacity: 1, color: "#000000", stagger: 0.07 
    }
  );

  // 3. Play the popping-in animation
  loadingTextTl.play();

  // 4. After complete, reverse with delay, then animate reveal block
  loadingTextTl.eventCallback("onComplete", function () {
    setTimeout(() => {
      // Reverse the text animation
      loadingTextTl.reverse();

      // When reverse is complete, animate the reveal block
      loadingTextTl.eventCallback("onReverseComplete", function () {
        const revealTl = gsap.timeline();
        revealTl
          .to(revealBlock, { 
            rotate: 45, 
            scale: 0, 
            duration: 0.6, 
            ease: "power3.inOut"
          })
          .to(revealBlock, { 
            autoAlpha: 0, 
            duration: 0.2, 
            ease: "power1.in" 
          });
      });
    }, 200); // 0.2s delay before reversing
  });
});
</script>

document.addEventListener("DOMContentLoaded", function () {
  gsap.registerPlugin(SplitText);

  document.querySelectorAll('.menu-container').forEach(container => {
    // Find ONLY .menu-text elements that DO NOT have any .menu-text children
    const menuTexts = Array.from(container.querySelectorAll('.menu-text'))
      .filter(el => !el.querySelector('.menu-text'));

    let allChars = [];

    menuTexts.forEach(el => {
      el._split = new SplitText(el, { type: "chars" });
      allChars.push(...el._split.chars);
    });

    const tl = gsap.timeline({ paused: true });
    tl.to(allChars, {
      y: '-100%',
      duration: 0.4,
      stagger: 0.04,
      ease: "power2.out"
    });

    container.addEventListener('mouseenter', () => tl.play());
    container.addEventListener('mouseleave', () => tl.reverse());

document.addEventListener("DOMContentLoaded", function () {
  const links = document.querySelectorAll('.menu-open-link');
  const imagesRow = document.querySelector('.images-row');
  const images = document.querySelectorAll('.menu-hover-image');
  const imageWidthVW = 42;
  const yStep = 140;
  const rotStep = 3;

  // Use a cubic-bezier for extra luxury
  const LUX_EASE = "cubic-bezier(0.77, 0, 0.175, 1)";

  function setActiveImage(activeIdx) {
    images.forEach((img, idx) => {
      const dist = Math.abs(idx - activeIdx);
      const direction = idx < activeIdx ? -1 : 1;

      let opacity = idx === activeIdx ? 1 : 0.17;
      let y = dist * yStep;
      let rot = dist * rotStep * direction;
      let scale = idx === activeIdx ? 1.08 : 0.94;
      let blur = idx === activeIdx ? 0 : Math.min(dist * 2, 8);

      if (idx === activeIdx) {
        y = 0;
        rot = 0;
      }

      gsap.to(img, {
        opacity: opacity,
        y: y,
        rotateZ: rot,
        scale: scale,
        filter: `blur(${blur}px)`,
        duration: 0.8,
        delay: dist * 0.03, // slight delay for cascade effect
        ease: LUX_EASE,
        overwrite: "auto"
      });
    });
  }

  // Move the row and animate images on hover
  links.forEach((link, i) => {
    link.addEventListener('mouseenter', () => {
      const newX = -i * imageWidthVW;
      gsap.to(imagesRow, {
        x: `${newX}vw`,
        duration: 1.0,
        ease: LUX_EASE
      });
      setActiveImage(i);
    });
  });

  // Set first image as active on load
  setActiveImage(0);
});
